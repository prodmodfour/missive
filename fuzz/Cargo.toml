[package]
name = "missive-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
missive-adapters = { path = "../crates/missive-adapters" }
missive-a2a = { path = "../crates/missive-a2a" }
missive-cli = { path = "../crates/missive-cli", default-features = false }
missive-core = { path = "../crates/missive-core" }
missive-store = { path = "../crates/missive-store" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "config_parse"
path = "fuzz_targets/config_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "a2a_json_parse"
path = "fuzz_targets/a2a_json_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "event_replay"
path = "fuzz_targets/event_replay.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cli_frame_parse"
path = "fuzz_targets/cli_frame_parse.rs"
test = false
doc = false
bench = false

[workspace]

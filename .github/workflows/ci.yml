name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      coverage:
        description: "Run optional cargo-llvm-cov smoke coverage"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch="amd64" ;;
            aarch64|arm64) arch="arm64" ;;
            *) echo "unsupported actionlint architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          mkdir -p "${RUNNER_TEMP}/actionlint"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_${arch}.tar.gz" \
            -o "${RUNNER_TEMP}/actionlint.tar.gz"
          tar -xzf "${RUNNER_TEMP}/actionlint.tar.gz" -C "${RUNNER_TEMP}/actionlint" actionlint
          "${RUNNER_TEMP}/actionlint/actionlint" -version
          echo "${RUNNER_TEMP}/actionlint" >> "${GITHUB_PATH}"

      - name: Validate GitHub Actions workflows
        run: actionlint -color=false

  quality-gate:
    name: Quality gate (Linux)
    runs-on: ubuntu-latest
    needs: workflow-lint
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile default --component rustfmt --component clippy
          rustup default stable
          rustup show

      - name: Cache Cargo dependencies and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            target
          key: ${{ runner.os }}-stable-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-stable-cargo-

      - name: Install system tools used by the local gate
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck pkg-config sqlite3

      - name: Run local quality gate
        run: scripts/quality-gate.sh

  workspace-matrix:
    name: Workspace (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: workflow-lint
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile default --component rustfmt --component clippy
          rustup default stable
          rustup show

      - name: Cache Cargo dependencies and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            target
          key: ${{ runner.os }}-stable-workspace-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-stable-workspace-
            ${{ runner.os }}-stable-cargo-

      - name: Check, test, and build the workspace
        run: |
          set -euo pipefail
          cargo check --workspace --all-targets --all-features
          cargo test --workspace --all-targets --all-features
          cargo build --workspace --all-features
          cargo build -p missive-cli --bin missive --all-features

  coverage:
    name: Optional coverage smoke
    runs-on: ubuntu-latest
    needs: workflow-lint
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.coverage) || vars.MISSIVE_CI_COVERAGE == '1' }}
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain with coverage tools
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile default --component llvm-tools-preview
          rustup default stable
          rustup show

      - name: Cache Cargo dependencies and coverage build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            target
          key: ${{ runner.os }}-stable-coverage-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-stable-coverage-
            ${{ runner.os }}-stable-cargo-

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Run coverage smoke without publishing reports
        run: cargo llvm-cov --workspace --all-features --no-report

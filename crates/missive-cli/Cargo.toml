[package]
name = "missive-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Command-line interface for missive."

[lib]
path = "src/lib.rs"

[[bin]]
name = "missive"
path = "src/main.rs"

[features]
default = ["native-keyring"]
native-keyring = ["dep:keyring"]

[dependencies]
clap.workspace = true
missive-adapters.workspace = true
missive-a2a.workspace = true
missive-core.workspace = true
missive-gateway.workspace = true
missive-observe.workspace = true
missive-router.workspace = true
missive-store.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["linux-native"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"], optional = true }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"], optional = true }

[target.'cfg(all(not(target_os = "linux"), not(target_os = "macos"), not(windows)))'.dependencies]
keyring = { version = "3.6", default-features = false, optional = true }

[dev-dependencies]
tempfile.workspace = true

[package]
name = "missive-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Adapter scaffolding for missive ingress and egress."

[lib]
path = "src/lib.rs"

[features]
default = []
external-chat-stubs = [
    "adapter-discord",
    "adapter-email",
    "adapter-matrix",
    "adapter-slack",
    "adapter-telegram",
]
adapter-discord = []
adapter-email = []
adapter-matrix = []

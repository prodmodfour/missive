[workspace]
members = [
    "crates/missive-adapters",
    "crates/missive-a2a",
    "crates/missive-cli",
    "crates/missive-core",
    "crates/missive-gateway",
    "crates/missive-observe",
    "crates/missive-router",
    "crates/missive-store",
    "crates/missive-test-support",
]
default-members = ["crates/missive-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[profile.dist]
inherits = "release"
codegen-units = 1
lto = "thin"
strip = "symbols"

[workspace.metadata.missive.release]
package = "missive-cli"
binary = "missive"
default-profile = "dist"
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[workspace.dependencies]
a2a = { package = "a2a-lf", version = "0.3" }
axum = { version = "0.7", features = ["http1", "json", "tokio"] }
missive-adapters = { path = "crates/missive-adapters", version = "0.1.0" }
missive-a2a = { path = "crates/missive-a2a", version = "0.1.0" }
missive-core = { path = "crates/missive-core", version = "0.1.0" }
missive-gateway = { path = "crates/missive-gateway", version = "0.1.0" }
missive-observe = { path = "crates/missive-observe", version = "0.1.0" }
missive-router = { path = "crates/missive-router", version = "0.1.0" }
missive-store = { path = "crates/missive-store", version = "0.1.0" }
missive-test-support = { path = "crates/missive-test-support", version = "0.1.0" }

clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap_mangen = "0.2"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
miette = { version = "7.2", features = ["fancy"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
fs2 = "0.4"
proptest = "1.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.13"
thiserror = "2.0"
toml = "0.8"
url = "2.5"
tokio = { version = "1.40", features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
